workflows:
  web-test:
    name: AI Menu Apps - Web
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.4
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Web
        script: flutter build web --release -t lib/main.dart
    artifacts:
      - build/web/**

  ios-test:
    name: AI Menu Apps - iOS unsigned
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.4
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Build iOS without signing
        script: flutter build ios --release --no-codesign -t lib/main.dart

      - name: Package unsigned IPA
        script: |
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/ios/ipa/Payload
          rm -rf build/ios/ipa/Payload/Runner.app
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry AI-Menu-Apps-unsigned.ipa Payload
          test -s AI-Menu-Apps-unsigned.ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
